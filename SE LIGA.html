<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SE LIGA! — Matemática</title>
    <link rel="stylesheet" href="seliga.css">

 
</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header>

        <div class="logo">
            MATEMÁTICA <span>•</span> SE LIGA!
        </div>

        <a href="./index.html" class="voltar">
            ← Voltar
        </a>

    </header>


    <!-- =========================
         CAPA
    ========================== -->

    <section class="capa">

        <span class="numero">
            Área de estudos
        </span>

        <h1>
            SE <span>LIGA!</span>
        </h1>

        <p class="descricao">
            Escolha sua turma para acessar os conteúdos,
            exercícios e revisões de Matemática.
        </p>

    </section>


    <!-- =========================
         TURMAS
    ========================== -->

    <main class="selecao">

        <div class="cabecalho-secao">

            <h2>Escolha sua turma</h2>

            <p>
                Selecione uma opção para continuar.
            </p>

        </div>


        <div class="turmas">

            <!-- 7º ANO -->

            <button
                class="turma"
                data-turma="7"
                onclick="mostrarTurma('7', this)"
            >

                <span class="turma-numero">
                    01
                </span>

                <h3>7º ano</h3>

                <p>Matemática</p>

            </button>


            <!-- 8º ANO -->

            <button
                class="turma"
                data-turma="8"
                onclick="mostrarTurma('8', this)"
            >

                <span class="turma-numero">
                    02
                </span>

                <h3>8º ano</h3>

                <p>Matemática</p>

            </button>


            <!-- 9º ANO -->

            <button
                class="turma"
                data-turma="9"
                onclick="mostrarTurma('9', this)"
            >

                <span class="turma-numero">
                    03
                </span>

                <h3>9º ano</h3>

                <p>Matemática</p>

            </button>


            <!-- 1º ANO -->

            <button
                class="turma"
                data-turma="1"
                onclick="mostrarTurma('1', this)"
            >

                <span class="turma-numero">
                    04
                </span>

                <h3>1º ano</h3>

                <p>Ensino Médio</p>

            </button>


            <!-- 2º ANO -->

            <button
                class="turma"
                data-turma="2"
                onclick="mostrarTurma('2', this)"
            >

                <span class="turma-numero">
                    05
                </span>

                <h3>2º ano</h3>

                <p>Ensino Médio</p>

            </button>


            <!-- 3º ANO -->

            <button
                class="turma"
                data-turma="3"
                onclick="mostrarTurma('3', this)"
            >

                <span class="turma-numero">
                    06
                </span>

                <h3>3º ano</h3>

                <p>Ensino Médio</p>

            </button>


            <!-- EDUCAÇÃO FINANCEIRA 1 -->

            <button
                class="turma"
                data-turma="1E"
                onclick="mostrarTurma('1E', this)"
            >

                <span class="turma-numero">
                    07
                </span>

                <h3>1º ano</h3>

                <p>Educação Financeira</p>

            </button>


            <!-- EDUCAÇÃO FINANCEIRA 2 -->

            <button
                class="turma"
                data-turma="2E"
                onclick="mostrarTurma('2E', this)"
            >

                <span class="turma-numero">
                    08
                </span>

                <h3>2º ano</h3>

                <p>Educação Financeira</p>

            </button>


            <!-- EDUCAÇÃO FINANCEIRA 3 -->

            <button
                class="turma"
                data-turma="3E"
                onclick="mostrarTurma('3E', this)"
            >

                <span class="turma-numero">
                    09
                </span>

                <h3>3º ano</h3>

                <p>Educação Financeira</p>

            </button>

        </div>


        <!-- =========================
             PAINEL DE TRIMESTRES
        ========================== -->

        <section
            id="painel"
            class="painel"
        >

            <div class="painel-cabecalho">

                <div>

                    <small id="painel-tipo">
                        Matemática
                    </small>

                    <h2 id="painel-titulo">
                        7º ano
                    </h2>

                </div>


                <button
                    class="fechar"
                    onclick="fecharTurma()"
                    aria-label="Fechar"
                >
                    ×
                </button>

            </div>


            <div class="trimestres">


                <!-- 1º TRIMESTRE -->

                <button
                    class="trimestre"
                    onclick="abrirTrimestre(1)"
                >

                    <span class="trimestre-numero">
                        01
                    </span>

                    <h3>
                        Primeiro trimestre
                    </h3>

                    <p>
                        Conteúdos e exercícios →
                    </p>

                </button>


                <!-- 2º TRIMESTRE -->

                <button
                    class="trimestre"
                    onclick="abrirTrimestre(2)"
                >

                    <span class="trimestre-numero">
                        02
                    </span>

                    <h3>
                        Segundo trimestre
                    </h3>

                    <p>
                        Conteúdos e exercícios →
                    </p>

                </button>


                <!-- 3º TRIMESTRE -->

                <button
                    class="trimestre"
                    onclick="abrirTrimestre(3)"
                >

                    <span class="trimestre-numero">
                        03
                    </span>

                    <h3>
                        Terceiro trimestre
                    </h3>

                    <p>
                        Conteúdos e exercícios →
                    </p>

                </button>


            </div>

        </section>

    </main>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <footer>

        SE LIGA! • Matemática

    </footer>


    <script>

        let turmaAtual = null;


        /*
         * Mostra o painel da turma selecionada.
         */

        function mostrarTurma(turma, botao) {

            turmaAtual = turma;

            const botoes =
                document.querySelectorAll(".turma");

            botoes.forEach(function(item) {
                item.classList.remove("ativo");
            });

            botao.classList.add("ativo");


            const painel =
                document.getElementById("painel");

            const titulo =
                document.getElementById("painel-titulo");

            const tipo =
                document.getElementById("painel-tipo");


            const dados = {

                "7": {
                    titulo: "7º ano",
                    tipo: "Matemática"
                },

                "8": {
                    titulo: "8º ano",
                    tipo: "Matemática"
                },

                "9": {
                    titulo: "9º ano",
                    tipo: "Matemática"
                },

                "1": {
                    titulo: "1º ano",
                    tipo: "Matemática • Ensino Médio"
                },

                "2": {
                    titulo: "2º ano",
                    tipo: "Matemática • Ensino Médio"
                },

                "3": {
                    titulo: "3º ano",
                    tipo: "Matemática • Ensino Médio"
                },

                "1E": {
                    titulo: "1º ano",
                    tipo: "Educação Financeira"
                },

                "2E": {
                    titulo: "2º ano",
                    tipo: "Educação Financeira"
                },

                "3E": {
                    titulo: "3º ano",
                    tipo: "Educação Financeira"
                }

            };


            titulo.textContent =
                dados[turma].titulo;

            tipo.textContent =
                dados[turma].tipo;


            painel.classList.add("ativo");


            setTimeout(function() {

                painel.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }, 100);
        }


        /*
         * Fecha o painel.
         */

        function fecharTurma() {

            const painel =
                document.getElementById("painel");

            painel.classList.remove("ativo");


            const botoes =
                document.querySelectorAll(".turma");

            botoes.forEach(function(item) {
                item.classList.remove("ativo");
            });


            turmaAtual = null;
        }


        /*
         * Aqui você poderá colocar os links
         * de cada trimestre.
         */

        function abrirTrimestre(numero) {

            if (!turmaAtual) {
                return;
            }


            console.log(
                "Turma:",
                turmaAtual,
                "Trimestre:",
                numero
            );


            /*
             * EXEMPLO:
             *
             * window.location.href =
             *     "./7ano/1-trimestre.html";
             *
             * Você pode colocar os caminhos
             * reais aqui depois.
             */

        }

    </script>

</body>
</html>
