<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SE LIGA! — Matemática</title>
    <link rel="stylesheet" href="seliga.css">

</head>

<body>

    <header>

        <div class="logo">
            MATEMÁTICA <span>•</span> SE LIGA!
        </div>

    </header>
    <section class="capa">

        <h1>
            SE <span>LIGA!</span>
        </h1>

    </section>
    <main class="selecao">
        <div class="cabecalho-secao">
            <h2>
                Escolha a turma:
            </h2>
        </div>
        <div class="turmas">


            <button class="turma" onclick="mostrarTurma('7', this)">

                <span class="categoria">
                    Matemática
                </span>

                <h3>
                    7º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('8', this)">

                <span class="categoria">
                    Matemática
                </span>

                <h3>
                    8º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('9', this)">

                <span class="categoria">
                    Matemática
                </span>

                <h3>
                    9º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('1', this)">

                <span class="categoria">
                    Matemática
                </span>

                <h3>
                    1º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('2', this)">

                <span class="categoria">
                    Matemática
                </span>

                <h3>
                    2º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('3', this)">

                <span class="categoria">
                    Matemática
                </span>

                <h3>
                    3º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('1E', this)">

                <span class="categoria azul">
                    Educação Financeira
                </span>

                <h3>
                    1º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('2E', this)">

                <span class="categoria azul">
                    Educação Financeira
                </span>

                <h3>
                    2º ano
                </h3>

            </button>


            <button class="turma" onclick="mostrarTurma('3E', this)">

                <span class="categoria azul">
                    Educação Financeira
                </span>

                <h3>
                    3º ano
                </h3>

            </button>


        </div>


        <section id="painel" class="painel">

            <div class="painel-cabecalho">

                <div>

                    <small id="painel-tipo">
                        Matemática
                    </small>

                    <h2 id="painel-titulo">
                        7º ano
                    </h2>

                </div>


                <button class="fechar" onclick="fecharTurma()" aria-label="Fechar">
                    ×
                </button>

            </div>


            <div class="trimestres">


                <!-- 1º TRIMESTRE -->

                <button class="trimestre" onclick="abrirTrimestre(1)">

                    <span class="trimestre-numero">
                        01
                    </span>

                    <h3>
                        Primeiro trimestre
                    </h3>


                </button>



                <button class="trimestre" onclick="abrirTrimestre(2)">

                    <span class="trimestre-numero">
                        02
                    </span>

                    <h3>
                        Segundo trimestre
                    </h3>


                </button>


                <button class="trimestre" onclick="abrirTrimestre(3)">

                    <span class="trimestre-numero">
                        03
                    </span>

                    <h3>
                        Terceiro trimestre
                    </h3>


                </button>


            </div>

        </section>

    </main>

    <footer>

        Professora Giovana Lemiska - SE LIGA.

    </footer>


    <script>

        let turmaAtual = null;

        const dadosTurmas = {

            "7": {
                titulo: "7º ano",
                categoria: "Matemática"
            },

            "8": {
                titulo: "8º ano",
                categoria: "Matemática"
            },

            "9": {
                titulo: "9º ano",
                categoria: "Matemática"
            },

            "1": {
                titulo: "1º ano",
                categoria: "Matemática"
            },

            "2": {
                titulo: "2º ano",
                categoria: "Matemática"
            },

            "3": {
                titulo: "3º ano",
                categoria: "Matemática"
            },

            "1E": {
                titulo: "1º ano",
                categoria: "Educação Financeira"
            },

            "2E": {
                titulo: "2º ano",
                categoria: "Educação Financeira"
            },

            "3E": {
                titulo: "3º ano",
                categoria: "Educação Financeira"
            }

        };

        function mostrarTurma(turma, botao) {

            turmaAtual = turma;


            const botoes =
                document.querySelectorAll(".turma");


            botoes.forEach(function (item) {

                item.classList.remove("ativo");

            });


            botao.classList.add("ativo");


            const painel =
                document.getElementById("painel");

            const titulo =
                document.getElementById("painel-titulo");

            const tipo =
                document.getElementById("painel-tipo");


            titulo.textContent =
                dadosTurmas[turma].titulo;


            tipo.textContent =
                dadosTurmas[turma].categoria;


            painel.classList.add("ativo");


            setTimeout(function () {

                painel.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }, 100);

        }

        function fecharTurma() {

            const painel =
                document.getElementById("painel");


            painel.classList.remove("ativo");


            const botoes =
                document.querySelectorAll(".turma");


            botoes.forEach(function (item) {

                item.classList.remove("ativo");

            });


            turmaAtual = null;

        }

        function abrirTrimestre(numero) {

            if (!turmaAtual) {
                return;
            }


            console.log(
                "Turma:",
                turmaAtual,
                "| Trimestre:",
                numero
            );


            /*
             * COLOQUE OS LINKS DOS SEUS ARQUIVOS AQUI.
             *
             * Exemplo:
             *
             * if (turmaAtual === "7" && numero === 1) {
             *     window.location.href =
             *         "./7ano/1-trimestre.html";
             * }
             */

        }

    </script>

</body>

</html>
