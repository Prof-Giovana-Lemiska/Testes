<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Área de Matemática</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2ff, #dfe7ff);
      color: #202638;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #ffffff;
      border-radius: 25px;
      padding: 50px 40px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(40, 60, 120, 0.15);
    }

    .icone {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3157d5, #7257d9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 10px 25px rgba(49, 87, 213, 0.25);
    }

    h1 {
      font-size: 42px;
      color: #3157d5;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .subtitulo {
      font-size: 18px;
      color: #697386;
      margin-bottom: 40px;
    }

    .botoes {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .botao {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      text-decoration: none;
      color: white;

      padding: 18px 25px;
      border-radius: 15px;

      font-size: 18px;
      font-weight: bold;

      transition: 0.3s ease;

      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.10);
    }

    .botao-lista {
      background: linear-gradient(135deg, #3157d5, #4771e8);
    }

    .botao-se-liga {
      background: linear-gradient(135deg, #7257d9, #8b70ed);
    }

    .botao:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
    }

    .rodape {
      margin-top: 35px;
      font-size: 14px;
      color: #8a92a3;
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 25px;
      }

      h1 {
        font-size: 34px;
      }

      .subtitulo {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icone">
      📐
    </div>

    <h1>Matemática</h1>

    <p class="subtitulo">
      Escolha uma opção para continuar
    </p>

    <div class="botoes">

      <a href="./listas.html" class="botao botao-lista">
        📚 Acessar Listas
      </a>

      <a href="./SE LIGA.html" class="botao botao-se-liga">
        🚀 Acessar o SE LIGA!
      </a>

    </div>

    <p class="rodape">
      Aprender • Praticar • Revisar
    </p>

  </main>

</body>
</html>
